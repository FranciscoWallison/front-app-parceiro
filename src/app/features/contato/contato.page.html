<ion-content>
  <app-page-header title="Fale conosco" subtitle="Mande sua dúvida ou sugestão" back="/home"></app-page-header>

  <form class="step-body">
    <label class="field">
      <span class="t-label">Assunto*</span>
      <input name="assunto" [(ngModel)]="assunto" placeholder="Ex: Dúvida sobre proposta PME" />
    </label>
    <label class="field">
      <span class="t-label">Mensagem*</span>
      <textarea name="mensagem" [(ngModel)]="mensagem" rows="6" placeholder="Descreva sua dúvida…"></textarea>
    </label>

    @if (error()) {
      <p class="form-error inline">{{ error() }}</p>
    }
    @if (notice()) {
      <p class="notice-banner">
        <ion-icon name="checkmark-circle-outline" aria-hidden="true"></ion-icon>
        {{ notice() }}
      </p>
    }

    <button type="button" class="nav-btn-primary" (click)="enviar()" [disabled]="busy()">
      @if (busy()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        <ion-icon name="send-outline" aria-hidden="true"></ion-icon>
      }
      Enviar mensagem
    </button>
  </form>

  <div class="bottom-spacer"></div>
</ion-content>
