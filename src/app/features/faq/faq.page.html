<ion-content>
  <app-page-header title="Perguntas frequentes" back="/home"></app-page-header>

  @if (loading()) {
    <div class="center-spinner"><ion-spinner></ion-spinner></div>
  } @else if (error()) {
    <div class="section"><p class="form-error">{{ error() }}</p></div>
  } @else {
    @for (g of categorias(); track g.cat) {
      <section class="faq-section">
        <span class="t-label section-label">{{ g.cat }}</span>
        <ion-accordion-group class="faq-accordion">
          @for (it of g.items; track it.id) {
            <ion-accordion [value]="it.id" toggleIconSlot="end">
              <ion-item slot="header" lines="none">
                <ion-label class="faq-question">{{ it.pergunta }}</ion-label>
              </ion-item>
              <div class="faq-answer" slot="content">{{ it.resposta }}</div>
            </ion-accordion>
          }
        </ion-accordion-group>
      </section>
    }
  }

  <div class="bottom-spacer"></div>
</ion-content>
