<ion-content>
  <app-page-header title="Propostas" back="/home"></app-page-header>

  <div class="segment-wrap">
    <ion-segment [value]="filtroTipo()" (ionChange)="onFiltroChange($event.detail.value)" mode="md">
      <ion-segment-button value="TODOS"><ion-label>Todos</ion-label></ion-segment-button>
      <ion-segment-button value="PF"><ion-label>Pessoa Física</ion-label></ion-segment-button>
      <ion-segment-button value="PME"><ion-label>PME</ion-label></ion-segment-button>
    </ion-segment>
  </div>

  @if (loading()) {
    <div class="center-spinner"><ion-spinner></ion-spinner></div>
  } @else if (error()) {
    <div class="section">
      <p class="form-error">{{ error() }}</p>
    </div>
  } @else if (propostas().length === 0) {
    <div class="empty-state">
      <div class="empty-icon">
        <ion-icon name="document-text-outline" aria-hidden="true"></ion-icon>
      </div>
      <h2 class="t-h3">Nenhuma proposta ainda</h2>
      <p class="t-meta">Crie sua primeira proposta para começar.</p>
      <ion-button class="cta-primary" routerLink="/propostas/nova-pf">
        <ion-icon name="add" slot="start"></ion-icon>
        Criar primeira proposta
      </ion-button>
    </div>
  } @else {
    <ul class="proposal-list">
      @for (p of propostas(); track p.id) {
        <li>
          <button class="proposal-item" type="button" (click)="abrir(p)">
            <div class="proposal-main">
              <span class="proposal-num t-numeral">#{{ p.numero }}</span>
              <span class="proposal-name">{{ p.titularOuEmpresa }}</span>
              <span class="proposal-meta t-meta">
                {{ p.tipo }} · {{ p.planoNome }} · {{ p.valorTotalCents / 100 | currency:'BRL':'symbol':'1.2-2' }}/mês
              </span>
              <span class="proposal-time t-meta">
                Atualizada {{ p.atualizadaEm | date:'short' }}
              </span>
            </div>
            <app-status-pill [status]="p.status" [short]="true"></app-status-pill>
          </button>
        </li>
      }
    </ul>
  }

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/propostas/nova-pf" color="primary" size="small">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <div class="bottom-spacer"></div>
</ion-content>
