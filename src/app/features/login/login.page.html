<ion-content>
  <div class="login-shell">
    <div class="brand-wordmark">Corretor</div>

    <div class="hero">
      <h1 class="t-h1">Acessar conta</h1>
      <p class="t-meta">Use seu CPF e senha cadastrados</p>
    </div>

    <form class="form" (ngSubmit)="submit()" #f="ngForm" autocomplete="on">
      <label class="field">
        <span class="t-label">CPF</span>
        <input
          name="cpf"
          type="tel"
          inputmode="numeric"
          appCpfMask
          [(ngModel)]="cpf"
          placeholder="000.000.000-00"
          required
          [disabled]="loading()"
          autocomplete="username"
        />
      </label>

      <label class="field">
        <span class="t-label">Senha</span>
        <input
          name="senha"
          type="password"
          [(ngModel)]="senha"
          placeholder="••••••••"
          required
          [disabled]="loading()"
          autocomplete="current-password"
        />
      </label>

      @if (errorMsg()) {
        <p class="form-error" role="alert">{{ errorMsg() }}</p>
      }

      <ion-button expand="block" type="submit" [disabled]="loading()" class="cta-primary">
        @if (loading()) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
        }
        Entrar
      </ion-button>

      @if (biometricAvailable() && hasBiometric()) {
        <button
          type="button"
          class="cta-biometric"
          (click)="loginBiometric()"
          [disabled]="loading()"
        >
          <ion-icon name="finger-print" aria-hidden="true"></ion-icon>
          Entrar com biometria
        </button>
      }

      <a class="link-secondary" routerLink="/esqueci-senha">Esqueci minha senha</a>
    </form>

    <details class="dev-hint">
      <summary>Credenciais de teste</summary>
      <p>CPF <code>12345678909</code> · senha <code>senha123</code> · ACME</p>
      <p>CPF <code>11144477735</code> · senha <code>senha123</code> · Beta</p>
    </details>
  </div>
</ion-content>
