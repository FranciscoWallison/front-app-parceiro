<ion-content>
  <app-page-header title="Materiais" subtitle="Artes e documentos para uso comercial" back="/home"></app-page-header>

  @if (loading()) {
    <div class="center-spinner"><ion-spinner></ion-spinner></div>
  } @else if (error()) {
    <div class="section"><p class="form-error">{{ error() }}</p></div>
  } @else if (materiais().length === 0) {
    <div class="empty-state">
      <div class="empty-icon">
        <ion-icon name="images-outline" aria-hidden="true"></ion-icon>
      </div>
      <h2 class="t-h3">Nenhum material disponível</h2>
      <p class="t-meta">Volte mais tarde para conferir novidades.</p>
    </div>
  } @else {
    <ul class="material-list">
      @for (m of materiais(); track m.id) {
        <li>
          <button type="button" class="material-row" (click)="download(m)">
            <span class="material-icon">
              <ion-icon [name]="iconePara(m.tipo)" aria-hidden="true"></ion-icon>
            </span>
            <span class="material-body">
              <span class="t-h3">{{ m.titulo }}</span>
              <span class="t-meta">{{ m.descricao }}</span>
            </span>
            <ion-icon class="material-action" name="download-outline" aria-hidden="true"></ion-icon>
          </button>
        </li>
      }
    </ul>
    @if (notice()) {
      <div class="section">
        <p class="t-meta debug-url">{{ notice() }}</p>
      </div>
    }
  }

  <div class="bottom-spacer"></div>
</ion-content>
